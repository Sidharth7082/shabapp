name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Camera-only invariant
        run: |
          count=$(grep -o 'type:"file"' dist/assets/*.js | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "::error::Found $count file input(s) in the bundle. Proof photos must be camera-only."
            exit 1
          fi
          echo "No file inputs in the bundle."

      - name: Version matches the update manifest
        run: |
          node -e "
            const pkg = require('./package.json');
            const manifest = require('./public/update.json');
            if (pkg.version !== manifest.version) {
              console.error('package.json is v' + pkg.version + ' but public/update.json is v' + manifest.version);
              console.error('Ship through npm run release so installed apps can see the update.');
              process.exit(1);
            }
            if (!manifest.apkUrl || !manifest.webUrl) {
              console.error('public/update.json needs apkUrl and webUrl');
              process.exit(1);
            }
            console.log('Version and update manifest agree on v' + pkg.version);
          "

      - name: Plan freshness reminder
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          before="${{ github.event.before }}"
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "Base commit $before is not available; skipping the plan freshness check."
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "$changed" | grep -qE '^(src|supabase)/' || exit 0
          echo "$changed" | grep -qx 'PLAN.md' && exit 0
          echo "::warning file=PLAN.md::Code changed but PLAN.md was not updated. Keep the living plan in sync."
